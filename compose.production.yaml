name: documind-production

x-application: &application
  image: documind-backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [data]
  volumes:
    - documents:/data/documents
    - models:/data/models
  secrets: [app_database_url, auth_secret]
  environment: &application-env
    ENVIRONMENT: production
    COOKIE_SECURE: "true"
    AUTH_SECRET_FILE: /run/secrets/auth_secret
    DATABASE_URL_FILE: /run/secrets/app_database_url
    ALLOWED_HOSTS: '["api","localhost"]'
    CORS_ORIGINS: '["${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}"]'
    STORAGE_PATH: /data/documents
    EMBEDDING_CACHE_PATH: /data/models
    EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
    OCR_ENABLED: ${OCR_ENABLED:-false}
    OCR_LANGUAGE: ${OCR_LANGUAGE:-eng}
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
    LLM_PROVIDER: disabled
    OMP_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
  pids_limit: 128
  logging: &rotation
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: pgvector/pgvector:pg17
    # Suppress SQL, bind parameters and failing-row DETAIL from database errors.
    command: [postgres, -c, log_statement=none, -c, log_min_messages=fatal, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, app_password, migration_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/01-documind.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U documind_admin -d documind"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *rotation

  migrate:
    <<: *application
    restart: "no"
    secrets: [migration_database_url]
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
      MIGRATION_STATEMENT_TIMEOUT_MS: "120000"
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *application
    command: [python, -m, uvicorn, "app.main:create_app", --factory, --host, "0.0.0.0", --port, "8000", --workers, "1", --limit-concurrency, "${API_CONCURRENCY:-64}", --no-access-log, --no-proxy-headers]
    mem_limit: ${API_MEMORY:-2g}
    cpus: ${API_CPUS:-2}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s

  worker:
    <<: *application
    command: [python, -m, app.documents.worker]
    environment:
      <<: *application-env
      WORKER_HEALTH_FILE: /tmp/worker-health.json
    mem_limit: ${WORKER_MEMORY:-3g}
    cpus: ${WORKER_CPUS:-2}
    stop_grace_period: ${WORKER_STOP_GRACE:-11m}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -m, app.core.diagnostics, worker-health]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 45s

  prepare-model:
    <<: *application
    profiles: [tools]
    restart: "no"
    networks: [edge, data]
    command: [python, -m, app.intelligence.cli, prepare]

  frontend:
    build: ./frontend
    image: documind-frontend:local
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, data]
    environment:
      BACKEND_URL: http://api:8000
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *rotation

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [edge]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      GATEWAY_MAX_BODY: ${GATEWAY_MAX_BODY:-21m}
      GATEWAY_API_RATE: ${GATEWAY_API_RATE:-20r/s}
      GATEWAY_AUTH_RATE: ${GATEWAY_AUTH_RATE:-10r/m}
      GATEWAY_EXPENSIVE_RATE: ${GATEWAY_EXPENSIVE_RATE:-30r/m}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend: {condition: service_healthy}
    logging: *rotation

networks:
  edge:
  data:
    internal: true
volumes:
  postgres_data:
  documents:
  models:
secrets:
  admin_password: {file: ./deploy/secrets/admin_password}
  app_password: {file: ./deploy/secrets/app_password}
  migration_password: {file: ./deploy/secrets/migration_password}
  app_database_url: {file: ./deploy/secrets/app_database_url}
  migration_database_url: {file: ./deploy/secrets/migration_database_url}
  auth_secret: {file: ./deploy/secrets/auth_secret}
