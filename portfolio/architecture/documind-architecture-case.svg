    <text x="30" y="620" class="lane">03 / VALIDATE RESULTS &amp; REVIEW CANDIDATES</text><path d="M280 215 H308" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 215 H588" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M840 215 H868" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M715 290 V388" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 465 H308" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M560 465 H588" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M840 465 H868" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M995 540 V638" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M870 715 H842" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280 715 H308" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M995 290 V388" fill="none" stroke="#358a86" stroke-width="2.5" marker-end="url(#teal)" stroke-dasharray="7 5"/><path d="M950 290 V325 H15 V715 H28" fill="none" stroke="#8070cb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M995 790 V815 H435 V792" fill="none" stroke="#358a86" stroke-width="2.5" marker-end="url(#teal)" stroke-dasharray="7 5"/><g class="architecture-node"><rect x="30" y="140" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="47" y="172" class="title">Parse + chunk</text><text x="47" y="206" class="body">PDF / DOCX / TXT</text><text x="47" y="231" class="body">OCR when necessary</text><text x="47" y="256" class="body">Background worker</text></g><g class="architecture-node"><rect x="310" y="140" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="327" y="172" class="title">Local chunk encoder</text><text x="327" y="206" class="body">Sentence Transformers</text><text x="327" y="231" class="body">all-MiniLM-L6-v2</text><text x="327" y="256" class="body">384D vectors (default)</text></g><g class="architecture-node"><rect x="590" y="140" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="607" y="172" class="title">PostgreSQL</text><text x="607" y="206" class="body">pgvector chunk vectors</text><text x="607" y="231" class="body">Sections + source refs</text><text x="607" y="256" class="body">Jobs + revision history</text></g><g class="architecture-node"><rect x="870" y="140" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="887" y="172" class="title">Selected revisions</text><text x="887" y="206" class="body">Authorized source text</text><text x="887" y="231" class="body">Configured AI analysis</text><text x="887" y="256" class="body">Deterministic analysis</text></g><g class="architecture-node"><rect x="30" y="390" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="47" y="422" class="title">User question</text><text x="47" y="456" class="body">Selected document scope</text><text x="47" y="481" class="body">Organization membership</text><text x="47" y="506" class="body">Access checked by API</text></g><g class="architecture-node"><rect x="310" y="390" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="327" y="422" class="title">Local query encoder</text><text x="327" y="456" class="body">all-MiniLM-L6-v2</text><text x="327" y="481" class="body">384D query vector</text><text x="327" y="506" class="body">Same embedding profile</text></g><g class="architecture-node"><rect x="590" y="390" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="607" y="422" class="title">Authorized retrieval</text><text x="607" y="456" class="body">Cosine similarity</text><text x="607" y="481" class="body">Organization + profile</text><text x="607" y="506" class="body">Relevant stored chunks</text></g><g class="architecture-node"><rect x="870" y="390" width="250" height="150" rx="14" fill="url(#g)" stroke="#6650bc"/><text x="887" y="422" class="title" style="fill:white">OpenAI GPT</text><text x="887" y="449" class="title" style="fill:white">Intelligence</text><text x="887" y="483" class="body" style="fill:#eee8ff">Responses API</text><text x="887" y="508" class="body" style="fill:#eee8ff">Q&amp;A + AI analysis</text></g><g class="architecture-node"><rect x="30" y="640" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="47" y="672" class="title">Deterministic rules</text><text x="47" y="706" class="body">Fields + text differences</text><text x="47" y="731" class="body">Configured risk rules</text><text x="47" y="756" class="body">Commitment candidates</text></g><g class="architecture-node"><rect x="310" y="640" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="327" y="672" class="title">Human review + ops</text><text x="327" y="706" class="body">Analysis candidates</text><text x="327" y="731" class="body">Approve / reject / correct</text><text x="327" y="756" class="body">Assignments + audit</text></g><g class="architecture-node"><rect x="590" y="640" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="607" y="672" class="title">Grounded answers</text><text x="607" y="706" class="body">GPT-generated prose</text><text x="607" y="731" class="body">Application citations</text><text x="607" y="756" class="body">Abstain if insufficient</text></g><g class="architecture-node"><rect x="870" y="640" width="250" height="150" rx="14" fill="white" stroke="#dce1ed"/><text x="887" y="672" class="title">Evidence validation</text><text x="887" y="706" class="body">Source IDs + exact quotes</text><text x="887" y="731" class="body">Numeric safeguards</text><text x="887" y="756" class="body">Validate before publish</text></g><text x="1010" y="337" class="small" style="fill:#287873">AI analysis</text>
      <text x="1010" y="362" class="small" style="fill:#287873">selected revisions</text>
      <text x="438" y="839" class="small" style="fill:#287873">AI analysis candidates → human review</text>
      <text x="30" y="875" class="small">Embeddings retrieve; GPT generates. Token accounting, cost estimates and organization budgets bound GPT use.</text>
      <text x="30" y="899" class="small">The provider is configurable. Real paid GPT Q&amp;A was validated locally; deterministic workflows remain independent.</text></svg>