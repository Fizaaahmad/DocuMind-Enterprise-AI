name: documind-demo

x-api: &api
  image: documind-demo-backend:local
  build: ./backend
  init: true
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [data]
  secrets: [app_database_url, auth_secret]
  volumes: [demo_documents:/data/documents:ro]
  environment: &environment
    ENVIRONMENT: production
    COOKIE_SECURE: "true"
    DEMO_MODE: "true"
    DEMO_ORGANIZATION_ID: d09a0000-0000-4000-8000-000000000001
    DEMO_VIEWER_ID: d09a0000-0000-4000-8000-000000000002
    AUTH_SECRET_FILE: /run/secrets/auth_secret
    DATABASE_URL_FILE: /run/secrets/app_database_url
    CORS_ORIGINS: '["${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}"]'
    ALLOWED_HOSTS: '["api","localhost"]'
    STORAGE_PATH: /data/documents
    LLM_PROVIDER: disabled
    LLM_REAL_REQUESTS_ENABLED: "false"
    EMBEDDINGS_ENABLED: "false"
    OCR_ENABLED: "false"
  mem_limit: 2g
  cpus: 1
  pids_limit: 128
  logging: &logs
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: documind_demo
      POSTGRES_USER: documind_demo_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    command: [postgres, -c, log_statement=none, -c, log_min_messages=fatal, -c, log_min_error_statement=panic, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_error_verbosity=terse]
    secrets: [admin_password, app_password, migration_password]
    volumes:
      - demo_database:/var/lib/postgresql/data
      - ./deploy/demo/init-db.sql:/docker-entrypoint-initdb.d/01-demo.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U documind_demo_admin -d documind_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    logging: *logs
  migrate:
    <<: *api
    restart: "no"
    secrets: [migration_database_url]
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  permissions:
    <<: *api
    restart: "no"
    secrets: [migration_database_url]
    environment:
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    command: [python, -m, app.demo.grants]
    depends_on:
      migrate: {condition: service_completed_successfully}
  seed:
    <<: *api
    profiles: [tools]
    restart: "no"
    volumes: [demo_documents:/data/documents]
    secrets: [migration_database_url, auth_secret]
    environment:
      <<: *environment
      DEMO_MODE: "false"
      DATABASE_URL_FILE: /run/secrets/migration_database_url
    command: [python, -m, app.demo.seed]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *api
    restart: unless-stopped
    command: [python, -m, uvicorn, "app.main:create_app", --factory, --host, "0.0.0.0", --port, "8000", --workers, "1", --limit-concurrency, "24", --no-access-log, --no-proxy-headers]
    depends_on:
      permissions: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
  frontend:
    build:
      context: ./frontend
      args: {DEMO_MODE: "true"}
    image: documind-demo-frontend:local
    restart: unless-stopped
    init: true
    networks: [edge, data]
    environment:
      BACKEND_URL: http://api:8000
      DEMO_MODE: "true"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      api: {condition: service_healthy}
    logging: *logs
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"
      - "${DEMO_BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8448}:443"
    networks: [edge]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      GATEWAY_MAX_BODY: ${GATEWAY_MAX_BODY:-64k}
      GATEWAY_API_RATE: ${GATEWAY_API_RATE:-20r/s}
      GATEWAY_AUTH_RATE: ${GATEWAY_AUTH_RATE:-10r/m}
      GATEWAY_EXPENSIVE_RATE: ${GATEWAY_EXPENSIVE_RATE:-10r/m}
    volumes:
      - ./deploy/demo/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/demo/certs:/etc/nginx/certs:ro
    depends_on: [frontend]
    logging: *logs

networks:
  edge:
  data: {internal: true}
volumes:
  demo_database:
  demo_documents:
secrets:
  admin_password: {file: ./deploy/demo/secrets/admin_password}
  app_password: {file: ./deploy/demo/secrets/app_password}
  migration_password: {file: ./deploy/demo/secrets/migration_password}
  app_database_url: {file: ./deploy/demo/secrets/app_database_url}
  migration_database_url: {file: ./deploy/demo/secrets/migration_database_url}
  auth_secret: {file: ./deploy/demo/secrets/auth_secret}
