# Opt-in overlay: only API and worker gain outbound access; no ports are added.
# docker compose -f compose.production.yaml -f compose.openai.yaml --env-file deploy/.env.production ...
services:
  api:
    networks: [data, ai_egress]
    secrets: [app_database_url, auth_secret, llm_api_key]
    environment: &openai-env
      LLM_PROVIDER: openai
      LLM_REAL_REQUESTS_ENABLED: ${LLM_REAL_REQUESTS_ENABLED:-false}
      LLM_MODEL: ${LLM_MODEL:?Set an explicit supported OpenAI model}
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:?Set verified input pricing}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:?Set verified output pricing}
      LLM_DAILY_COST_USD: ${LLM_DAILY_COST_USD:-1}
      LLM_DAILY_TOKENS: ${LLM_DAILY_TOKENS:-100000}
      AI_DAILY_REQUESTS: ${AI_DAILY_REQUESTS:-100}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-32000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  worker:
    networks: [data, ai_egress]
    secrets: [app_database_url, auth_secret, llm_api_key]
    environment: *openai-env
networks:
  ai_egress:
secrets:
  llm_api_key:
    file: ./deploy/secrets/llm_api_key
